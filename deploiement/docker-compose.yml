# Le Cherchant — le conteneur qui sert lecherchant.fr.
#
# Ce service n'est PAS géré par Coolify, et c'est volontaire : Coolify tient les
# deux sites du frère de Félix (fransktradgard.se et sohamnathayoga.fr) et il n'y
# avait aucune raison de demander un accès à son tableau de bord pour poser un
# site statique. Traefik, lui, découvre les conteneurs par leurs labels : il route
# celui-ci exactement comme les autres, sans rien savoir de Coolify.
#
# Conséquence à connaître : ce conteneur n'apparaîtra pas dans l'interface de
# Coolify. Il se redémarre seul (restart: unless-stopped) et survit aux reboots.
#
# Tout se défait par : docker compose down (et rien d'autre n'en dépend).

services:
  lecherchant:
    image: nginx:1.27-alpine
    container_name: lecherchant
    restart: unless-stopped

    volumes:
      # La racine web est le clone git, monté en LECTURE SEULE : le serveur web
      # n'a aucune raison d'écrire dans le dépôt, et « ro » le garantit plutôt
      # que de l'espérer.
      - ./depot:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      # Le réseau de Traefik. Sans cela le proxy ne peut pas joindre le conteneur
      # et répond 502.
      - coolify

    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # Le port interne du conteneur. nginx:alpine écoute sur 80.
      - traefik.http.services.lch.loadbalancer.server.port=80

      # --- Middlewares propres à ce site ---------------------------------
      #
      # Tous préfixés « lch- » : les noms de middlewares déclarés par labels sont
      # globaux au fournisseur docker, et un nom générique comme « gzip » est
      # déjà pris par le conteneur de fransktradgard.se.
      - traefik.http.middlewares.lch-vers-https.redirectscheme.scheme=https
      - traefik.http.middlewares.lch-vers-https.redirectscheme.permanent=true

      # www -> apex, en 301. L'apex est la forme canonique : le domaine a été
      # choisi pour dire le nom de la marque, « Le Cherchant », article compris.
      # (Le site voisin fait l'inverse, apex -> www ; ce n'est pas une
      # incohérence, c'est un autre propriétaire et un autre choix.)
      # $${1} et non ${1} : docker compose substitue les variables avant que
      # Traefik ne voie le label. Ecrit ${1}, le groupe capture disparait et
      # www.lecherchant.fr/page redirige vers la racine, en silence.
      - traefik.http.middlewares.lch-www-vers-apex.redirectregex.regex=^https://www\.lecherchant\.fr/(.*)
      - traefik.http.middlewares.lch-www-vers-apex.redirectregex.replacement=https://lecherchant.fr/$${1}
      - traefik.http.middlewares.lch-www-vers-apex.redirectregex.permanent=true

      # --- La porte ---------------------------------------------------
      #
      # Authentification HTTP Basic, verifiee par Traefik. C'est une VRAIE porte :
      # le proxy repond 401 et ne transmet rien a nginx, donc les 2,3 Mo de
      # l'application ne sont pas livres tant que le code n'est pas donne. C'est
      # tout ce qui separe ce montage d'un mot de passe ecrit dans la page, qui
      # ne protegeait rien sur GitHub Pages — voir ACCES.md.
      #
      # L'empreinte est en bcrypt. Le mot de passe lui-meme n'apparait nulle part,
      # ni ici, ni sur le serveur, ni dans le depot.
      #
      # L'empreinte elle-meme n'est PAS dans ce fichier : elle vit dans
      # /data/sites/lecherchant/.env, sur le serveur, et nulle part ailleurs.
      # Motif : ce depot est public. Une empreinte bcrypt d'un mot du
      # dictionnaire se casse en quelques secondes — la publier reviendrait a
      # publier le mot de passe. Le fichier .env n'est pas dans le depot et ne
      # doit jamais y entrer.
      #
      # Pour changer le code :
      #   sudo docker run --rm httpd:2.4-alpine htpasswd -nbB <identifiant> <mdp>
      #   puis coller le resultat dans .env, et docker compose up -d
      #
      # Le label est entre guillemets et le message de defaut ne contient pas de
      # deux-points : sans cela YAML lit « cle : valeur » et rejette la ligne.
      # Et dans .env, les $ de l'empreinte doivent etre DOUBLES — compose
      # interpole aussi le contenu de .env, pas seulement celui de ce fichier.
      - "traefik.http.middlewares.lch-porte.basicauth.users=${PORTE_USERS:?definir PORTE_USERS dans .env}"
      - traefik.http.middlewares.lch-porte.basicauth.realm=Le Cherchant

      # Limitation de debit, par adresse IP source. ACCES.md § 3 l'exige :
      # « limiter les tentatives, sans quoi on essaie tous les prenoms du
      # calendrier en une nuit ». Elle ne protege pas d'une devinette heureuse —
      # rien ne le peut — mais elle rend l'essai en masse inutilisable.
      #
      # 120 par minute : une visite normale fait trois requetes (la page, le
      # service worker, jsPDF), et toute la loge peut etre derriere une seule IP
      # si les freres sont sur le wifi du temple. La marge est donc large.
      - traefik.http.middlewares.lch-limite.ratelimit.average=120
      - traefik.http.middlewares.lch-limite.ratelimit.period=1m
      - traefik.http.middlewares.lch-limite.ratelimit.burst=60

      # --- HTTP : on ne sert rien en clair, on redirige ------------------
      - traefik.http.routers.lch-http.rule=Host(`lecherchant.fr`) || Host(`www.lecherchant.fr`)
      - traefik.http.routers.lch-http.entryPoints=http
      - traefik.http.routers.lch-http.middlewares=lch-vers-https
      - traefik.http.routers.lch-http.service=lch

      # --- HTTPS : le site ------------------------------------------------
      - traefik.http.routers.lch-https.rule=Host(`lecherchant.fr`)
      - traefik.http.routers.lch-https.entryPoints=https
      - traefik.http.routers.lch-https.tls=true
      - traefik.http.routers.lch-https.tls.certresolver=letsencrypt
      - traefik.http.routers.lch-https.middlewares=lch-limite,lch-porte
      - traefik.http.routers.lch-https.service=lch

      # --- HTTPS : www, qui ne fait que rediriger --------------------------
      # Router distinct, sinon la redirection s'appliquerait aussi à l'apex.
      - traefik.http.routers.lch-https-www.rule=Host(`www.lecherchant.fr`)
      - traefik.http.routers.lch-https-www.entryPoints=https
      - traefik.http.routers.lch-https-www.tls=true
      - traefik.http.routers.lch-https-www.tls.certresolver=letsencrypt
      - traefik.http.routers.lch-https-www.middlewares=lch-www-vers-apex
      - traefik.http.routers.lch-https-www.service=lch

      # --- L'adresse de secours a ete RETIREE ------------------------------
      # Elle servait le site sur lecherchant.51.195.223.56.sslip.io, en clair et
      # sans la porte. Elle etait utile tant que le DNS ne pointait pas ici ; une
      # fois la porte posee, elle en devenait le contournement — et l'y soumettre
      # n'aurait rien valu de mieux, l'authentification Basic en HTTP faisant
      # circuler le code en clair sur le reseau.
      # Pour diagnostiquer sans passer par le DNS, interroger le conteneur depuis
      # le serveur : curl --resolve lecherchant.fr:443:127.0.0.1 https://lecherchant.fr/

networks:
  coolify:
    external: true
