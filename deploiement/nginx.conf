# Le Cherchant — configuration du conteneur nginx qui sert lecherchant.fr.
#
# Ce fichier est monté dans /etc/nginx/conf.d/default.conf. Il ne porte AUCUN
# en-tête de sécurité : ceux-là sont posés par Traefik, à l'entrypoint https,
# par la chaîne « securite » définie dans /data/coolify/proxy/dynamic/securite.yaml.
# Les redoubler ici les ferait apparaître deux fois dans la réponse.
#
# Ce qui est ici, et qui ne peut être nulle part ailleurs : la politique de cache,
# parce qu'elle diffère selon le fichier et qu'un middleware d'entrypoint ne sait
# pas distinguer les chemins.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Politique de cache -------------------------------------------------
    #
    # Le service worker passe la PAGE en réseau d'abord (sw.js, V2.3.0), et c'est
    # délibéré : le dépôt est déployé plusieurs fois par jour. Sans « no-cache »
    # ici, le cache HTTP du navigateur réintroduirait en amont exactement le
    # figement que le service worker s'emploie à éviter — et il gagnerait, car il
    # répond avant lui.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Un service worker mis en cache ne se met jamais à jour : l'application
    # resterait sur une version morte, et il n'existe aucun moyen de la déloger
    # à distance. C'est le fichier le plus dangereux à laisser en cache.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # jsPDF ne change qu'avec son numéro de version, inscrit dans le nom du
    # fichier. Cache maximal, sans revalidation.
    location = /jspdf.umd.min.js {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Ce que le serveur ne doit pas livrer --------------------------------
    #
    # La racine web est un CLONE GIT. Sans cette première règle, /.git/ serait
    # téléchargeable et livrerait tout l'historique du dépôt à qui le demande.
    # Le dépôt est public aujourd'hui ; il ne le sera pas toujours (voir
    # PASSATION.md § 5), et cette règle doit tenir ce jour-là.
    location ~ /\. {
        deny all;
    }

    # travaux/ n'est pas le produit, outils/ est de l'outillage de développement.
    location ~ ^/(travaux|outils|deploiement)/ {
        deny all;
    }

    # La documentation du projet n'a pas à être servie par le site.
    location ~ \.(md|py|yml)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Compression ---------------------------------------------------------
    #
    # index.html fait 2,3 Mo, l'essentiel en base64 (images et polices). Le
    # base64 se comprime mal mais il se comprime : l'économie reste large.
    # La compression est faite ici et non par un middleware Traefik, pour que la
    # politique de ce site ne dépende pas d'un middleware déclaré par le
    # conteneur d'un autre site.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # nginx est derrière Traefik : les vraies adresses arrivent en en-tête.
    # Sans cela, tous les accès seraient journalisés sous l'IP du proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
}
