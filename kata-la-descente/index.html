<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Kata — La Descente : fiction interactive dans les catacombes interdites de Paris. Un seul chemin ramène au jour.">
<title>Kata — La Descente</title>

<!--
  KATA — LA DESCENTE
  Fiction interactive à choix multiples. Fichier unique, aucune dépendance, aucun build.

  V0.1 — première descente jouable
    • Moteur de graphe : 48 nœuds, 16 dénouements — 13 morts, 2 échecs, 1 sortie.
    • Un seul chemin ramène au jour. Tout le reste tue, coûte cher, ou renvoie en arrière.
    • Ressource unique : la frontale. Chaque choix la consomme. À zéro, le noir absolu,
      et le noir absolu tue — c’est la mort la plus fréquente et la moins spectaculaire.
    • Le sac choisi à la première scène conditionne trois morts bien plus loin :
      « léger » ne peut pas changer ses piles, « chargé » ne passe pas la chatière.
      Le joueur ne fait le lien qu’à la deuxième partie. C’est voulu.
    • Collection d’épitaphes en localStorage : mourir n’est pas perdre, c’est graver.

  Conventions d’écriture — identiques au Quiz Maçonnique :
    apostrophes courbes ’, guillemets « », espace fine insécable U+202F avant ? ! ; :
    et à l’intérieur des guillemets. Les commentaires disent pourquoi, pas quoi.

  Le texte narratif vit entre les balises DÉBUT TEXTE / FIN TEXTE : c’est la zone que
  le script de normalisation typographique traite, et lui seul. Ne rien mettre d’autre
  dedans que des chaînes destinées à être lues.
-->

<style>
/* ——— Fondations ——————————————————————————————————————————————————————— */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: #08080a;
  /* Le halo de la frontale : un cône de lumière posé en haut de l’écran, qui laisse
     les bords de la page dans le noir. C’est tout le décor du jeu. */
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(201,162,39,.13) 0%, rgba(201,162,39,.04) 38%, transparent 70%),
    radial-gradient(90% 50% at 50% 110%, rgba(120,140,160,.05) 0%, transparent 70%);
  background-attachment: fixed;
  color: #cfc8b8;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.6;
  padding-bottom: 4rem;
}
.cache { display: none !important; }

h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; line-height: 1.25; margin: 0; }
h1 { font-size: 1.9rem; letter-spacing: .01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
h1:focus, h2:focus, h3:focus { outline: none; }
p { margin: 0 0 1.05em; }

.enveloppe { max-width: 44rem; margin: 0 auto; padding: 0 1.15rem; }

/* ——— Barre d’état ————————————————————————————————————————————————————— */
#barre {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(#08080aee, #08080ad0 70%, #08080a00);
  backdrop-filter: blur(6px);
  padding: .55rem 0 .9rem;
}
.barre-ligne { display: flex; align-items: center; gap: .75rem; }
.jauge-bloc { flex: 1 1 auto; min-width: 0; }
.jauge-etiquette {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
  color: #8a8478; margin-bottom: .28rem;
}
.jauge { height: 5px; background: #1c1c1f; border-radius: 3px; overflow: hidden; }
.jauge > i { display: block; height: 100%; background: #c9a227; transition: width .45s ease, background .45s ease; }
.jauge.faible > i { background: #d08a2c; }
.jauge.critique > i { background: #b4443a; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* ——— Boutons ————————————————————————————————————————————————————————— */
button { font: inherit; color: inherit; cursor: pointer; }
.btn-icone {
  background: transparent; border: 1px solid #2a2a2e; border-radius: 6px;
  padding: .3rem .55rem; font-size: .72rem; letter-spacing: .1em;

}
.btn-icone:hover, .btn-icone:focus-visible { border-color: #c9a227; color: #d8cfae; }

.btn-principal {
  display: inline-block; background: transparent;
  border: 1px solid #c9a227; border-radius: 3px;
  color: #e0d3a4; padding: .7rem 1.6rem;
  font-size: .82rem; letter-spacing: .19em; text-transform: uppercase;
}
.btn-principal:hover, .btn-principal:focus-visible { background: #c9a2271a; }

.btn-second {
  background: transparent; border: 1px solid #34343a; border-radius: 3px;
  color: #9a9488; padding: .62rem 1.2rem;
  font-size: .76rem; letter-spacing: .14em; text-transform: uppercase;
}
.btn-second:hover, .btn-second:focus-visible { border-color: #6a6458; color: #cfc8b8; }

:focus-visible { outline: 2px solid #c9a227; outline-offset: 2px; }

/* ——— Écran-titre ————————————————————————————————————————————————————— */
#titre-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 3rem 0; }
.titre-marque { font-size: 3.1rem; letter-spacing: .06em; color: #e6dcc0; margin-bottom: .2rem; }
.titre-sous { font-family: Georgia, serif; font-style: italic; color: #9a9488; font-size: 1.15rem; margin-bottom: 2.2rem; }
.epigraphe {
  border-left: 2px solid #3a3a40; padding-left: 1rem; margin: 0 0 2.4rem;
  font-family: Georgia, serif; font-style: italic; color: #a39d90; font-size: .95rem;
}
.epigraphe cite { display: block; font-style: normal; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: #6f6a5f; margin-top: .5rem; }
.titre-actions { display: flex; flex-wrap: wrap; gap: .7rem; }

/* ——— Narration ———————————————————————————————————————————————————————— */
.lieu {
  font-size: .68rem; letter-spacing: .22em; text-transform: uppercase;
  color: #7d776b; margin-bottom: .45rem;
}
#noeud-titre { color: #e6dcc0; margin-bottom: 1.3rem; }
.narration { font-family: Georgia, "Times New Roman", serif; font-size: 1.06rem; line-height: 1.78; color: #c6bfaf; }
.narration em { color: #dcd2b6; }
.narration .souffle { display: block; text-align: center; color: #6f6a5f; letter-spacing: .6em; margin: 1.6rem 0; }

.choix-liste { list-style: none; margin: 2rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
.choix {
  width: 100%; text-align: left; background: #0e0e11;
  border: 1px solid #2a2a2e; border-left: 3px solid #3a3a40; border-radius: 3px;
  padding: .9rem 1rem; color: #c2bbab; line-height: 1.5;
  transition: border-color .18s ease, transform .18s ease, background .18s ease;
}
.choix:hover, .choix:focus-visible {
  border-color: #4a4a52; border-left-color: #c9a227;
  background: #131317; color: #e6dcc0; transform: translateX(3px);
}
.choix-num { color: #6f6a5f; font-size: .8rem; margin-right: .5rem; }

/* ——— Dénouement ——————————————————————————————————————————————————————— */
#fin-screen { padding-top: 3rem; }
.fin-genre { font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; margin-bottom: .6rem; }
.fin-mort .fin-genre { color: #b4443a; }
.fin-echec .fin-genre { color: #7d776b; }
.fin-victoire .fin-genre { color: #c9a227; }
#fin-titre { color: #e6dcc0; margin-bottom: 1.4rem; }

/* La dalle : lettres creusées dans le calcaire. L’ombre portée vers le bas et la
   lumière vers le haut donnent le relief en creux, sans la moindre image. */
.dalle {
  margin: 2.2rem 0; padding: 1.9rem 1.3rem; text-align: center;
  background: linear-gradient(#151517, #101012);
  border: 1px solid #2a2a2e; border-radius: 2px;
}
.dalle-mention { font-size: .62rem; letter-spacing: .3em; text-transform: uppercase; color: #5e594f; margin-bottom: 1rem; }
.dalle-texte {
  font-family: Georgia, serif; font-size: 1.02rem; line-height: 1.8;
  letter-spacing: .07em; color: #6e6a60;
  text-shadow: 0 1px 0 #000, 0 -1px 0 #34343a;
}
.releve { list-style: none; margin: 2rem 0 0; padding: 0; font-size: .84rem; color: #8a8478; }
.releve li { display: flex; justify-content: space-between; gap: 1rem; padding: .42rem 0; border-bottom: 1px solid #1c1c1f; }
.releve b { color: #c6bfaf; font-weight: 600; }
.fin-actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 2.2rem; }

/* ——— Épitaphes ———————————————————————————————————————————————————————— */
.epitaphe-grille { list-style: none; margin: 1.8rem 0 0; padding: 0; display: grid; gap: .7rem; }
@media (min-width: 620px) { .epitaphe-grille { grid-template-columns: 1fr 1fr; } }
.epitaphe-carte { background: #0e0e11; border: 1px solid #2a2a2e; border-radius: 3px; padding: .95rem 1rem; }
.epitaphe-carte.inconnue { border-style: dashed; border-color: #1e1e22; color: #4a463e; }
.epitaphe-cause { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: #b4443a; margin-bottom: .5rem; }
.epitaphe-carte.victoire .epitaphe-cause { color: #c9a227; }
.epitaphe-carte.echec .epitaphe-cause { color: #7d776b; }
.epitaphe-mot { font-family: Georgia, serif; font-size: .95rem; line-height: 1.6; color: #8f8a7e; }
.epitaphe-carte.inconnue .epitaphe-mot { font-style: italic; }

/* ——— Aide ————————————————————————————————————————————————————————————— */
.bloc-aide { margin-top: 1.8rem; }
.bloc-aide h3 { color: #c9a227; margin-bottom: .5rem; }
.bloc-aide p, .bloc-aide li { color: #a8a295; font-size: .93rem; }
.bloc-aide ul { padding-left: 1.1rem; }
.bloc-aide li { margin-bottom: .4rem; }
.avertissement {
  border: 1px solid #4a2b28; background: #17100f; border-radius: 3px;
  padding: 1rem 1.1rem; margin-top: 1.8rem;
}
.avertissement h3 { color: #b4443a; }
.pied { margin-top: 3.5rem; padding-top: 1.4rem; border-top: 1px solid #1c1c1f; font-size: .76rem; color: #5e594f; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .choix:hover, .choix:focus-visible { transform: none; }
}
</style>
</head>

<div id="titre-screen">

  </div>
</div>

<!-- ————— Épitaphes ————— -->
<div id="epitaphes-screen" class="cache">
  <div class="enveloppe" style="padding-top:2.5rem">

      <button class="btn-second" id="btn-retour-aide">Retour</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   DÉBUT TEXTE
   Tout ce qui est lu par le joueur vit ici, et rien d’autre. Le script de
   normalisation typographique ne traite que les chaînes de cette zone.
   ═══════════════════════════════════════════════════════════════════════════ */

const UI = {
  accroche: "Trois cents kilomètres de galeries sous Paris, fermées au public depuis 1955. Cette nuit, tu y descends. Une seule suite de choix te ramènera au jour ; toutes les autres se terminent sous terre.",

  reprendreConfirme: "Abandonner la descente en cours et remonter au jour ?",

  releveFrontale: "Frontale restante",
  releveChemin: "Chemin parcouru",
  dalleGit: "Ci-gît",
  dalleEchec: "Sans épitaphe",

    ["Le principe", "À chaque scène, deux à quatre choix. Un seul enchaînement de bons choix ramène au jour. Les autres tuent, ou coûtent si cher qu’ils tuent plus loin. Il n’y a ni score, ni sauvegarde à mi-chemin : on redescend depuis le seuil."],
    ["La frontale", "C’est ta seule ressource. Chaque choix la consomme, les détours la vident plus vite. À zéro, le noir est total, et le noir total tue — c’est la mort la plus banale des catacombes, et la plus fréquente dans ce jeu."],
    ["Le sac", "Ce que tu emportes à la première scène ne se rattrape pas. Deux des trois sacs contiennent leur propre mort, très loin en aval. Tu ne comprendras pourquoi qu’en mourant."],
    ["Les épitaphes", "Mourir n’est pas perdre : chaque fin grave sa dalle sur le mur des épitaphes, et le mur se garde d’une partie à l’autre. Il y a seize dénouements. Un seul te ramène.",],
    ["Au clavier", "Les chiffres 1 à 4 choisissent, Tabulation circule, Entrée valide. Rien ne se joue à la vitesse : tu as tout le temps de lire."]
  ],
  avertissementTitre: "Ceci est une fiction",
  avertissementTexte: "La descente dans les carrières souterraines de Paris est interdite par l’arrêté du 2 novembre 1955 et sanctionnée d’une amende. Les dangers décrits ici sont réels — fontis, galeries noyées, atmosphères viciées, désorientation — et le sont bien davantage que ne le raconte un texte. Ce jeu n’enseigne aucun itinéraire, ne donne aucune entrée, et n’invite personne à descendre."
};

/* Le graphe. Chaque nœud : un lieu, un titre, deux ou trois paragraphes, des choix.
   Un nœud portant « fin » achève la partie. « cout » est la dépense de frontale,
   « pose » un jalon mémorisé, « si » masque un choix, et « vers » peut être une
   fonction quand la destination dépend du sac ou des jalons. */
const HISTOIRE = {

  /* ——— I. LE SEUIL ——————————————————————————————————————————————— */

  preparation: {
    lieu: "Quelques heures plus tôt",
    titre: "Le sac",
    texte: [
      "Le rendez-vous est à minuit, dans un pavillon du quatorzième dont la cave ouvre sur un puits de carrier scellé en 1936. On t’a donné une clé et une phrase : « tu remontes avant six heures, ou tu ne remontes pas ».",
      "Sur le lit, le sac attend, ouvert. On ne descend pas deux fois dans les mêmes conditions : ce que tu y mets ce soir, tu l’auras jusqu’au bout, et rien de plus."
    ],
    choix: [
      { t: "Léger. Frontale, téléphone, une barre de céréales. On file vite, on remonte vite.", vers: "rendezvous", cout: 0, sac: "leger" },
      { t: "Mesuré. Frontale et jeu de piles en rechange, deux litres d’eau, une craie, des bottes, une combinaison.", vers: "rendezvous", cout: 0, sac: "mesure" },
      { t: "Chargé. Tout ce qui pourrait servir : cordes, casque lourd, réchaud, trépied, batterie, le grand sac de montagne.", vers: "rendezvous", cout: 0, sac: "lourd" }
    ]
  },

  rendezvous: {
    lieu: "Paris XIV, 00 h 40",
    titre: "Trois façons d’entrer",
    texte: [
      "La ville respire au-dessus de toi comme un animal endormi. Sous tes pieds, à vingt-cinq mètres, il y a plus de rues qu’au-dessus, et personne pour les nommer.",
      "Trois entrées, à dix minutes de marche l’une de l’autre. Tu n’en essaieras qu’une : au-delà, la nuit sera trop courte."
    ],
    choix: [
      { t: "La plaque de fonte en pleine rue. Deux minutes de crochet, on est dessous.", vers: "rue_police", cout: 3 },
      { t: "Le puits du pavillon, celui dont on t’a confié la clé.", vers: "puits", cout: 3 },
      { t: "Le tunnel de l’ancienne ceinture ferroviaire, par le talus. Personne ne surveille ça.", vers: "ceinture", cout: 5 }
    ]
  },

  rue_police: {
    lieu: "Rue Dareau",
    titre: "En pleine lumière",
    texte: [
      "Tu as la barre à mine sous la plaque quand le faisceau te prend de côté. Ils étaient garés vingt mètres plus haut, moteur coupé, et ils attendaient exactement ça : quelqu’un qui ouvre la chaussée à une heure du matin.",
      "Le sac est fouillé sur le capot. On relève ton identité, on t’explique l’arrêté de 1955, on te remet un timbre-amende. Puis on te regarde partir à pied vers le métro fermé."
    ],
    fin: {
      type: "echec",
      cause: "Interpellé en surface",
      epitaphe: "Il n’aura jamais vu le calcaire. La seule entrée qu’il ait forcée était éclairée par un réverbère."
    }
  },

  ceinture: {
    lieu: "Talus de la petite ceinture",
    titre: "La voie oubliée",
    texte: [
      "Le grillage est ouvert depuis des années. Sous les platanes, la voie s’enfonce dans une tranchée et disparaît sous un pont. L’odeur est celle d’une cave, en plus vaste.",

    ],
    choix: [
      { t: "Marcher entre les rails, c’est le plus plat. Le ronronnement, c’est l’éclairage public.", vers: "mort_rail", cout: 4 },
      { t: "Longer le mur du tunnel, hors de la voie, jusqu’à trouver une porte de service.", vers: "ceinture_porte", cout: 6 },
      { t: "Ce ronronnement ne me dit rien qui vaille. Demi-tour, je tente le puits du pavillon.", vers: "puits", cout: 9 }
    ]
  },

  ceinture_porte: {
    lieu: "Tunnel de la ceinture",
    titre: "La porte de service",
    texte: [
      "La porte existe. Elle est en tôle, neuve, fermée d’un cadenas à combinaison et surmontée d’une caméra dont la diode clignote en rouge, lentement, comme un cœur au repos.",
      "Derrière toi, le rail continue de luire. Devant toi, il n’y a rien. Tu as brûlé une heure et un quart de pile pour apprendre que cette entrée-là s’est refermée."
    ],
    choix: [
      { t: "Repartir vers le pavillon pendant qu’il reste de la nuit.", vers: "puits", cout: 12 },
      { t: "Rentrer chez moi. On ne force pas une porte sous une caméra.", vers: "echec_renonce", cout: 0 }
    ]
  },

  echec_renonce: {
    lieu: "Boulevard extérieur, 02 h 10",
    titre: "Le demi-tour",
    texte: [
      "Tu remontes le talus, tu remets le grillage en place derrière toi par une politesse dont personne ne saura rien. Le boulevard est vide, les feux passent au vert pour des voitures qui n’existent pas.",
      "C’était la décision raisonnable. Elle a le goût qu’ont toujours les décisions raisonnables prises à deux heures du matin devant une porte fermée."
    ],
    fin: {
      type: "echec",
      cause: "Renoncement",
      epitaphe: "Il est rentré entier. Il y a des façons de survivre qui ne se racontent pas."

/* ——— Moteur ——————————————————————————————————————————————————————————— */

const CLE_EPITAPHES = "kata.epitaphes";
const CLE_STATS = "kata.stats";
const CLE_PARTIE = "kata.partie";

const ECRANS = ["titre-screen", "jeu-screen", "fin-screen", "epitaphes-screen", "aide-screen"];

let E = null;          // état de la descente en cours
let ecranRetour = "titre-screen";   // d’où l’on vient, pour les écrans annexes

function lire(cle, defaut) {
  try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }
  catch (err) { return defaut; }
}
function ecrire(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (err) { /* navigation privée */ }
}
function effacer(cle) {
  try { localStorage.removeItem(cle); } catch (err) { /* idem */ }
}

/* Même convention que le Quiz : on masque, on affiche, on remonte, et on pose le
   focus sur le premier titre de l’écran affiché. Un écran sans h1-h3 casse le focus. */
function switchScreen(showId) {
  ECRANS.forEach(function (id) {
    document.getElementById(id).classList.toggle("cache", id !== showId);
  });
  window.scrollTo(0, 0);
  const titre = document.getElementById(showId).querySelector("h1, h2, h3");
  if (titre) { titre.setAttribute("tabindex", "-1"); titre.focus(); }
}

function noeudsDeFin() {
  return Object.keys(HISTOIRE).filter(function (id) { return HISTOIRE[id].fin; });
}

/* ——— Écran-titre —————————————————————————————————————————————————————— */

function afficherTitre() {
  const stats = lire(CLE_STATS, { parties: 0, victoires: 0 });
  const vues = lire(CLE_EPITAPHES, []);
  const total = noeudsDeFin().length;

  document.getElementById("titre-accroche").textContent = UI.accroche;
  document.getElementById("titre-stats").textContent = stats.parties
    ? UI.statsFormat.replace("{parties}", stats.parties)
                    .replace("{victoires}", stats.victoires)
                    .replace("{gravees}", vues.length)
                    .replace("{total}", total)
    : UI.statsVierge;

  const sauvegarde = lire(CLE_PARTIE, null);
  document.getElementById("btn-reprendre").classList.toggle("cache", !sauvegarde);

  switchScreen("titre-screen");
}

/* ——— Partie ——————————————————————————————————————————————————————————— */

function nouvellePartie() {
  E = { noeud: "preparation", pile: 100, pas: 0, sac: null, marques: [], journal: [] };
  const stats = lire(CLE_STATS, { parties: 0, victoires: 0 });
  stats.parties += 1;
  ecrire(CLE_STATS, stats);
  afficherNoeud("preparation");
}

function reprendrePartie() {
  const sauvegarde = lire(CLE_PARTIE, null);
  if (!sauvegarde || !HISTOIRE[sauvegarde.noeud]) { nouvellePartie(); return; }
  E = sauvegarde;
  afficherNoeud(E.noeud);
}

function majJauge() {
  const pct = Math.max(0, Math.min(100, Math.round(E.pile)));
  document.getElementById("jauge-barre").style.width = pct + "%";
  document.getElementById("jauge-valeur").textContent = pct + " %";
  const jauge = document.getElementById("jauge");
  jauge.classList.toggle("faible", pct <= 50 && pct > 22);
  jauge.classList.toggle("critique", pct <= 22);
}

function afficherNoeud(id) {
  const n = HISTOIRE[id];
  if (!n) { afficherTitre(); return; }

  E.noeud = id;
  if (E.journal[E.journal.length - 1] !== (n.lieu || n.titre)) {
    E.journal.push(n.lieu || n.titre);
  }

  if (n.fin) { ecrire(CLE_PARTIE, null); effacer(CLE_PARTIE); afficherFin(n); return; }
  ecrire(CLE_PARTIE, E);

  document.getElementById("noeud-lieu").textContent = n.lieu || "";
  document.getElementById("noeud-titre").textContent = n.titre;

  const zone = document.getElementById("noeud-texte");
  zone.textContent = "";
  n.texte.forEach(function (para) {
    const p = document.createElement("p");
    p.textContent = para;
    zone.appendChild(p);
  });

  const liste = document.getElementById("choix-liste");
  liste.textContent = "";
  const visibles = n.choix.filter(function (c) { return typeof c.si !== "function" || c.si(E); });

  visibles.forEach(function (c, i) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "choix";
    b.type = "button";
    const num = document.createElement("span");
    num.className = "choix-num";
    num.textContent = (i + 1) + ".";
    b.appendChild(num);
    b.appendChild(document.createTextNode(c.t));
    b.addEventListener("click", function () { jouerChoix(c); });
    li.appendChild(b);
    liste.appendChild(li);
  });

  E.choixCourants = visibles.length;
  majJauge();
  switchScreen("jeu-screen");
}

function jouerChoix(c) {
  E.pas += 1;
  if (c.sac) { E.sac = c.sac; }
  if (c.pose && E.marques.indexOf(c.pose) === -1) { E.marques.push(c.pose); }

  E.pile -= (typeof c.cout === "number" ? c.cout : 5);

  /* Le rechargement s'applique APRES la depense : changer ses piles coute encore
     quelques pour cent de l'ancien jeu, et c'est la seule remontee de jauge du jeu. */
  if (typeof c.recharge === "number" && E.pile > 0) { E.pile = c.recharge; }

  /* La pile épuisée l’emporte sur tout le reste : peu importe la destination prévue,
     on ne va nulle part sans lumière. C’est ce qui rend les détours coûteux mortels. */
  if (E.pile <= 0) { E.pile = 0; afficherNoeud("mort_obscurite"); return; }

  const dest = (typeof c.vers === "function") ? c.vers(E) : c.vers;
  afficherNoeud(dest);
}

/* ——— Dénouement ——————————————————————————————————————————————————————— */

function afficherFin(n) {
  const f = n.fin;

  const vues = lire(CLE_EPITAPHES, []);
  if (vues.indexOf(f.cause) === -1) { vues.push(f.cause); ecrire(CLE_EPITAPHES, vues); }
  if (f.type === "victoire") {
    const stats = lire(CLE_STATS, { parties: 0, victoires: 0 });
    stats.victoires += 1;
    ecrire(CLE_STATS, stats);
  }

  const env = document.getElementById("fin-enveloppe");
  env.className = "enveloppe fin-" + f.type;

  document.getElementById("fin-genre").textContent =
    f.type === "victoire" ? UI.genreVictoire : (f.type === "echec" ? UI.genreEchec : UI.genreMort);
  document.getElementById("fin-titre").textContent = n.titre;

  const zone = document.getElementById("fin-texte");
  zone.textContent = "";
  n.texte.forEach(function (para) {
    const p = document.createElement("p");
    p.textContent = para;
    zone.appendChild(p);
  });

  document.getElementById("dalle-mention").textContent =
    f.type === "victoire" ? UI.dalleSortie : (f.type === "echec" ? UI.dalleEchec : UI.dalleGit);
  document.getElementById("dalle-texte").textContent = f.epitaphe;

  const releve = document.getElementById("fin-releve");
  releve.textContent = "";
  [[UI.releveProfondeur, String(E.pas)],
   [UI.releveFrontale, Math.max(0, Math.round(E.pile)) + " %"],
   [UI.releveChemin, E.journal.join(" · ")]].forEach(function (paire) {
    const li = document.createElement("li");
    const g = document.createElement("span"); g.textContent = paire[0];
    const d = document.createElement("b"); d.textContent = paire[1];
    li.appendChild(g); li.appendChild(d);
    releve.appendChild(li);
  });

  switchScreen("fin-screen");
}

/* ——— Épitaphes ———————————————————————————————————————————————————————— */

function afficherEpitaphes(retour) {
  ecranRetour = retour;
  const vues = lire(CLE_EPITAPHES, []);
  document.getElementById("epitaphes-intro").textContent = UI.epitaphesIntro;

  const grille = document.getElementById("epitaphe-grille");
  grille.textContent = "";

  noeudsDeFin().forEach(function (id) {
    const f = HISTOIRE[id].fin;
    const connue = vues.indexOf(f.cause) !== -1;
    const li = document.createElement("li");
    li.className = "epitaphe-carte " + (connue ? f.type : "inconnue");

    const cause = document.createElement("p");
    cause.className = "epitaphe-cause";
    cause.textContent = connue ? f.cause : UI.inconnue;

    const mot = document.createElement("p");
    mot.className = "epitaphe-mot";
    mot.textContent = connue ? f.epitaphe : UI.inconnueMot;

    li.appendChild(cause); li.appendChild(mot);
    grille.appendChild(li);
  });

  switchScreen("epitaphes-screen");
}

/* ——— Aide ————————————————————————————————————————————————————————————— */

function afficherAide(retour) {
  ecranRetour = retour;
  const zone = document.getElementById("aide-contenu");
  zone.textContent = "";

  UI.aide.forEach(function (bloc) {
    const d = document.createElement("div");
    d.className = "bloc-aide";
    const h = document.createElement("h3"); h.textContent = bloc[0];
    const p = document.createElement("p"); p.textContent = bloc[1];
    d.appendChild(h); d.appendChild(p);
    zone.appendChild(d);
  });

  const av = document.createElement("div");
  av.className = "avertissement";
  const ah = document.createElement("h3"); ah.textContent = UI.avertissementTitre;
  const ap = document.createElement("p"); ap.textContent = UI.avertissementTexte;
  av.appendChild(ah); av.appendChild(ap);
  zone.appendChild(av);

  switchScreen("aide-screen");
}

/* ——— Câblage —————————————————————————————————————————————————————————— */

document.getElementById("btn-descendre").addEventListener("click", nouvellePartie);
document.getElementById("btn-reprendre").addEventListener("click", reprendrePartie);
document.getElementById("btn-redescendre").addEventListener("click", nouvellePartie);
document.getElementById("btn-titre-fin").addEventListener("click", afficherTitre);
document.getElementById("btn-epitaphes-titre").addEventListener("click", function () { afficherEpitaphes("titre-screen"); });
document.getElementById("btn-epitaphes-fin").addEventListener("click", function () { afficherEpitaphes("fin-screen"); });
document.getElementById("btn-aide-titre").addEventListener("click", function () { afficherAide("titre-screen"); });
document.getElementById("btn-retour-epitaphes").addEventListener("click", function () { switchScreen(ecranRetour); });
document.getElementById("btn-retour-aide").addEventListener("click", function () { switchScreen(ecranRetour); });

document.getElementById("btn-abandonner").addEventListener("click", function () {
  if (window.confirm(UI.reprendreConfirme)) { effacer(CLE_PARTIE); afficherTitre(); }
});

/* Les chiffres 1 à 4 choisissent. On ne les capte que sur l’écran de jeu, et jamais
   quand le focus est dans un champ — il n’y en a pas aujourd’hui, il y en aura. */
document.addEventListener("keydown", function (ev) {
  if (document.getElementById("jeu-screen").classList.contains("cache")) { return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) { return; }
  const n = parseInt(ev.key, 10);
  if (!n || n < 1 || n > 9) { return; }
  const boutons = document.querySelectorAll("#choix-liste .choix");
  if (boutons[n - 1]) { ev.preventDefault(); boutons[n - 1].click(); }
});

afficherTitre();
</script>
