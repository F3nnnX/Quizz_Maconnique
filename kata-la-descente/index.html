<title>Kata — La Descente</title>

<!--
  KATA — LA DESCENTE
  Fiction interactive à choix multiples. Fichier unique, aucune dépendance, aucun build.

  V0.2 — image, son, vibration, texte réduit
    • Texte divisé par deux. Les scènes faisaient trois à quatre paragraphes denses :
      sur un écran de 390 px, il fallait dérouler avant de voir le premier choix, et
      l'attention tombait avant la décision. Deux paragraphes courts, décision visible.
    • Une image par scène, générée en SVG : dix-sept décors procéduraux (puits, galerie,
      chatière, fontis, galerie noyée…) déclinés par une graine tirée de l'identifiant
      du nœud. Aucune photographie — rien à charger, rien à créditer, et deux galeries
      ne se ressemblent jamais tout à fait.
    • Ambiance sonore synthétisée à la volée par l'API Web Audio : grondement filtré,
      gouttes espacées au hasard, battement de cœur quand la pile devient critique.
      Aucun fichier son. Le contexte audio ne peut naître que d'un geste de l'utilisateur
      (politique d'autoplay) : il est créé au premier clic sur « Descendre », pas avant.
    • Vibration : brève à chaque choix, longue et heurtée à la mort. navigator.vibrate
      est absent sur iOS et sur ordinateur — tout est gardé, rien n'échoue bruyamment.
    • Intrigue : quelqu'un d'autre est descendu cette nuit. Une lampe derrière, des
      traces de coudes au seuil de la chatière, une flèche retournée, une craie fraîche
      sur la troisième marche. Le fil se paie au dénouement, dans la victoire comme
      dans le noir.

  V0.1 — première descente jouable
    • Moteur de graphe : 48 nœuds, 16 dénouements — 13 morts, 2 échecs, 1 sortie.
    • Un seul chemin ramène au jour. Tout le reste tue, coûte cher, ou renvoie en arrière.
    • Ressource unique : la frontale. Chaque choix la consomme. À zéro, le noir absolu,
      et le noir absolu tue — c'est la mort la plus fréquente et la moins spectaculaire.
    • Le sac choisi à la première scène conditionne deux morts bien plus loin :
      « léger » ne peut pas changer ses piles, « chargé » ne passe pas la chatière.
      Le joueur ne fait le lien qu'à la deuxième partie. C'est voulu.
    • Collection d'épitaphes en localStorage : mourir n'est pas perdre, c'est graver.

  Conventions d'écriture — identiques au Quiz Maçonnique :
    apostrophes courbes ’, guillemets « », espace fine insécable U+202F avant ? ! ; :
    et à l'intérieur des guillemets. Les commentaires disent pourquoi, pas quoi.

  Le texte narratif vit entre les balises DÉBUT TEXTE / FIN TEXTE : c'est la zone que
  outils/typographie.py traite, et lui seul. Ne rien mettre d'autre dedans que des
  chaînes destinées à être lues.
-->

<style>

     les bords de la page dans le noir. C’est tout le décor de l’interface. */
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(201,162,39,.13) 0%, rgba(201,162,39,.04) 38%, transparent 70%),
    radial-gradient(90% 50% at 50% 110%, rgba(120,140,160,.05) 0%, transparent 70%);
  background-attachment: fixed;
  color: #cfc8b8;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.6;
  padding-bottom: 3.5rem;
}

h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; line-height: 1.25; margin: 0; }

/* ——— Barre d’état ————————————————————————————————————————————————————— */

  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(#08080aee, #08080ad0 70%, #08080a00);

}
.barre-ligne { display: flex; align-items: center; gap: .6rem; }

  display: flex; justify-content: space-between; align-items: baseline;
  font-size: .66rem; letter-spacing: .16em; text-transform: uppercase;
  color: #8a8478; margin-bottom: .26rem;
}
.jauge { height: 5px; background: #1c1c1f; border-radius: 3px; overflow: hidden; }
.jauge > i { display: block; height: 100%; background: #c9a227; transition: width .45s ease, background .45s ease; }
.jauge.faible > i { background: #d08a2c; }

@keyframes pulse { 50% { opacity: .45; } }

/* ——— Boutons ————————————————————————————————————————————————————————— */

/* ——— L’image de la scène ——————————————————————————————————————————— */

/* ——— Écran-titre ————————————————————————————————————————————————————— */
#titre-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 2.5rem 0; }
.titre-marque { font-size: 3rem; letter-spacing: .06em; color: #e6dcc0; margin-bottom: .2rem; }

/* ——— Narration ———————————————————————————————————————————————————————— */
.lieu {

}

.choix-liste { list-style: none; margin: 1.5rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
.choix {
  width: 100%; text-align: left; background: #0e0e11;
  border: 1px solid #2a2a2e; border-left: 3px solid #3a3a40; border-radius: 3px;
  padding: .82rem 1rem; color: #c2bbab; line-height: 1.45; font-size: .97rem;
  transition: border-color .18s ease, transform .18s ease, background .18s ease;
}
.choix:hover, .choix:focus-visible {

/* ——— Dénouement ——————————————————————————————————————————————————————— */
#fin-screen { padding-top: 2rem; }

.fin-mort .fin-genre { color: #b4443a; }
.fin-echec .fin-genre { color: #7d776b; }
.fin-victoire .fin-genre { color: #c9a227; }
#fin-titre { color: #e6dcc0; margin-bottom: 1rem; }

/* La dalle : lettres creusées dans le calcaire. L’ombre portée vers le bas et la
   lumière vers le haut donnent le relief en creux, sans la moindre image. */
.dalle {
  margin: 1.8rem 0; padding: 1.6rem 1.2rem; text-align: center;

}
.dalle-mention { font-size: .6rem; letter-spacing: .3em; text-transform: uppercase; color: #5e594f; margin-bottom: .85rem; }
.dalle-texte {
  font-family: Georgia, serif; font-size: 1rem; line-height: 1.75;
  letter-spacing: .07em; color: #6e6a60;
  text-shadow: 0 1px 0 #000, 0 -1px 0 #34343a;
  margin: 0;
}
.releve { list-style: none; margin: 1.6rem 0 0; padding: 0; font-size: .82rem; color: #8a8478; }
.releve li { display: flex; justify-content: space-between; gap: 1rem; padding: .4rem 0; border-bottom: 1px solid #1c1c1f; }
.releve b { color: #c6bfaf; font-weight: 600; text-align: right; }
.releve li.chemin b { font-weight: 400; font-size: .76rem; color: #8a8478; }
.fin-actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.9rem; }

/* ——— Épitaphes ———————————————————————————————————————————————————————— */
.epitaphe-grille { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: .65rem; }
@media (min-width: 620px) { .epitaphe-grille { grid-template-columns: 1fr 1fr; } }
.epitaphe-carte { background: #0e0e11; border: 1px solid #2a2a2e; border-radius: 3px; padding: .9rem 1rem; }
.epitaphe-carte.inconnue { border-style: dashed; border-color: #1e1e22; color: #4a463e; }
.epitaphe-cause { font-size: .66rem; letter-spacing: .18em; text-transform: uppercase; color: #b4443a; margin-bottom: .45rem; }
.epitaphe-carte.victoire .epitaphe-cause { color: #c9a227; }
.epitaphe-carte.echec .epitaphe-cause { color: #7d776b; }
.epitaphe-carte.inconnue .epitaphe-cause { color: #4a463e; }

/* ——— Aide ————————————————————————————————————————————————————————————— */

.bloc-aide p { color: #a8a295; font-size: .92rem; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .choix:hover, .choix:focus-visible { transform: none; }

</style>

<!-- ————— Écran-titre ————— -->
<div id="titre-screen">
  <div class="enveloppe">

    <div class="scene" id="titre-scene" aria-hidden="true"></div>

    <blockquote class="epigraphe">
      Visite l’intérieur de la terre, et en rectifiant tu trouveras la pierre cachée.

        <div class="jauge-etiquette"><span>Frontale</span><span id="jauge-valeur">100 %</span></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   DÉBUT TEXTE
   Tout ce qui est lu par le joueur vit ici, et rien d'autre. Le script de
   normalisation typographique ne traite que les chaînes de cette zone.
   ═══════════════════════════════════════════════════════════════════════════ */

const UI = {
  accroche: "Trois cents kilomètres de galeries sous Paris, fermées depuis 1955. Cette nuit, tu descends. Une seule suite de choix te ramènera au jour.",
  epitaphesIntro: "Chaque mort grave sa ligne. Les dalles vides attendent la tienne.",
  statsFormat: "Descentes : {parties} — remontées : {victoires} — épitaphes : {gravees} sur {total}.",
  statsVierge: "Aucune descente. Le puits est ouvert.",
  reprendreConfirme: "Abandonner la descente en cours et remonter au jour ?",
  releveProfondeur: "Choix engagés",
  releveFrontale: "Frontale restante",
  releveChemin: "Chemin parcouru",
  dalleGit: "Ci-gît",
  dalleEchec: "Sans épitaphe",
  dalleSortie: "Gravé sur la trappe",
  genreMort: "Mort sous terre",
  genreEchec: "Remonté sans avoir vu",
  genreVictoire: "Retour au jour",
  inconnue: "Dalle vierge",
  inconnueMots: [
    "Cette mort-là ne t’a pas encore trouvé.",
    "La pierre attend.",
    "Quelque chose, ici, n’a pas encore eu ta peau.",
    "Rien de gravé. Pas encore."
  ],
  sonActif: "Son",
  sonCoupe: "Muet",
  aide: [
    ["Le principe", "Deux à quatre choix par scène. Un seul enchaînement ramène au jour ; les autres tuent, ou coûtent si cher qu’ils tuent plus loin. Pas de sauvegarde à mi-chemin : on redescend depuis le seuil."],
    ["La frontale", "Ta seule ressource. Chaque choix la consomme, les détours la vident plus vite. À zéro, le noir est total — et le noir total tue."],
    ["Le sac", "Ce que tu emportes à la première scène ne se rattrape pas. Deux des trois sacs contiennent leur propre mort, très loin en aval."],
    ["Les épitaphes", "Chaque fin grave sa dalle sur un mur qui se garde d’une partie à l’autre. Il y a seize dénouements. Un seul te ramène."],
    ["Son et vibration", "L’ambiance démarre au premier clic sur Descendre — un navigateur n’autorise pas le son avant. Le bouton Son la coupe. Le téléphone vibre à chaque choix, et longuement quand tu meurs."],
    ["Au clavier", "Les chiffres 1 à 4 choisissent, Tabulation circule, Entrée valide. Rien ne se joue à la vitesse."]
  ],
  avertissementTitre: "Ceci est une fiction",
  avertissementTexte: "La descente dans les carrières souterraines de Paris est interdite par l’arrêté du 2 novembre 1955 et sanctionnée d’une amende. Les dangers décrits ici sont réels, et bien davantage que ne le raconte un texte. Ce jeu n’enseigne aucun itinéraire, ne donne aucune entrée, et n’invite personne à descendre."
};

/* Le graphe. Chaque nœud : un décor, un lieu, un titre, deux paragraphes courts,
   des choix. Un nœud portant « fin » achève la partie. « cout » est la dépense de
   frontale, « recharge » la remet à niveau, « pose » un jalon mémorisé, « si »
   masque un choix, et « vers » peut être une fonction quand la destination dépend
   du sac ou des jalons. « image » nomme le décor procédural. */
const HISTOIRE = {

  /* ——— I. LE SEUIL ——————————————————————————————————————————————— */

  preparation: {
    image: "chambre", lieu: "Quelques heures plus tôt", titre: "Le sac",
    texte: [
      "Minuit. Un pavillon du quatorzième, une cave, un puits scellé en 1936. On t’a donné une clé et une phrase : tu remontes avant six heures.",
      "Le sac est ouvert sur le lit. Ce que tu y mets, tu l’auras jusqu’au bout."
    ],
    choix: [
      { t: "Léger. Frontale, téléphone, une barre de céréales.", vers: "rendezvous", cout: 0, sac: "leger" },
      { t: "Mesuré. Frontale, piles de rechange, eau, craie, bottes.", vers: "rendezvous", cout: 0, sac: "mesure" },
      { t: "Chargé. Cordes, casque lourd, réchaud, trépied, le grand sac.", vers: "rendezvous", cout: 0, sac: "lourd" }
    ]
  },

  rendezvous: {
    image: "rue", lieu: "Paris XIV, 00 h 40", titre: "Trois façons d’entrer",
    texte: [
      "Dessous, il y a plus de rues qu’au-dessus, et personne pour les nommer.",
      "Trois entrées. Tu n’en essaieras qu’une : la nuit est trop courte pour deux."
    ],
    choix: [
      { t: "La plaque de fonte, en pleine rue. Deux minutes.", vers: "rue_police", cout: 3 },
      { t: "Le puits du pavillon, celui de la clé.", vers: "puits", cout: 3 },
      { t: "Le tunnel de la petite ceinture, par le talus.", vers: "ceinture", cout: 5 }
    ]
  },

  rue_police: {
    image: "rue", lieu: "Rue Dareau", titre: "En pleine lumière",
    texte: [
      "Le faisceau te prend de côté. Ils étaient garés vingt mètres plus haut, moteur coupé, et ils attendaient exactement ça.",
      "Sac fouillé, identité relevée, timbre-amende. Puis on te regarde partir vers un métro fermé."
    ],
    fin: { type: "echec", cause: "Interpellé en surface",
      epitaphe: "Il n’aura jamais vu le calcaire. La seule entrée qu’il ait forcée était éclairée par un réverbère." }
  },

  ceinture: {
    image: "rail", lieu: "Talus de la petite ceinture", titre: "La voie oubliée",
    texte: [
      "La voie s’enfonce sous un pont. L’odeur est celle d’une cave, en plus vaste.",
      "Un rail luit d’un éclat trop propre pour être abandonné. Sur ta droite, un transformateur ronronne."
    ],
    choix: [
      { t: "Marcher entre les rails. Ce ronronnement, c’est l’éclairage.", vers: "mort_rail", cout: 4 },
      { t: "Longer le mur, hors de la voie, chercher une porte de service.", vers: "ceinture_porte", cout: 6 },
      { t: "Ce ronronnement ne me dit rien qui vaille. Demi-tour.", vers: "puits", cout: 9 }
    ]

/* ——— Les décors ———————————————————————————————————————————————————————
   Dix-sept archétypes dessinés en SVG, déclinés par une graine tirée de
   l'identifiant du nœud : deux galeries ne se ressemblent jamais tout à fait,
   mais la même scène redonne toujours le même dessin d'une partie à l'autre.
   Aucune image binaire, donc aucun octet à charger et rien à créditer.       */

function graine(txt) {
  let h = 2166136261;
  for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h += 0x6D2B79F5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const OCRE = "#c9a227", OS = "#8f8a7e", SANG = "#b4443a";

/* Grain de calcaire : des éclats courts, plus denses près du sol. Sans lui,
   les parois sont des aplats et le dessin a l'air d'un pictogramme. */
function grain(r, n, y0, y1) {
  let s = "";
  for (let i = 0; i < n; i++) {
    const x = r() * 400, y = y0 + r() * (y1 - y0), l = 2 + r() * 7;
    s += '<path d="M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'l' + l.toFixed(0) + ' ' + (r() * 3 - 1.5).toFixed(0) +
         '" stroke="' + OS + '" stroke-opacity="' + (.05 + r() * .16).toFixed(2) + '" stroke-width="1"/>';
  }
  return s;
}

/* La voûte en plein cintre des carriers, répétée en profondeur : c'est elle
   qui donne la perspective, et c'est la forme la plus reconnaissable du réseau. */
function voute(cx, w, hb, ht, opac, trait) {
  return '<path d="M' + (cx - w) + ' ' + hb + ' L' + (cx - w) + ' ' + ht +
         ' A' + w + ' ' + (w * .28).toFixed(1) + ' 0 0 1 ' + (cx + w) + ' ' + ht +
         ' L' + (cx + w) + ' ' + hb + '" fill="none" stroke="' + OCRE +
         '" stroke-opacity="' + opac + '" stroke-width="' + (trait || 1) + '"/>';
}

    let s = '<rect x="0" y="0" width="400" height="210" fill="#0a0a0c"/>';
    s += '<path d="M112 0 L288 0 L340 210 L60 210z" fill="' + OCRE + '" fill-opacity=".1"/>';
    s += '<rect x="112" y="0" width="176" height="26" fill="#e6dcc0" fill-opacity=".72"/>';
    for (let i = 0; i < 7; i++) {
      const x = 124 + i * 26;
      s += '<path d="M' + x + ' 26 L' + (x - 20 + i * 6) + ' 210" stroke="#e6dcc0" stroke-opacity="' + (.05 + r() * .07).toFixed(2) + '" stroke-width="6"/>';
    }
    s += '<path d="M170 210 l0 -54 q30 -20 60 0 l0 54z" fill="#08080a" fill-opacity=".8"/>';
    s += '<circle cx="200" cy="148" r="15" fill="#08080a"/>';
    return s + grain(r, 18, 120, 205);
  },

  noir: function (r) {
    let s = '<rect x="0" y="0" width="400" height="210" fill="#050506"/>';
    for (let i = 0; i < 130; i++) {
      s += '<circle cx="' + (r() * 400).toFixed(0) + '" cy="' + (r() * 210).toFixed(0) + '" r="' + (.4 + r()).toFixed(1) +
           '" fill="' + OS + '" fill-opacity="' + (.02 + r() * .05).toFixed(2) + '"/>';
    }
    s += '<ellipse cx="200" cy="105" rx="150" ry="80" fill="' + OCRE + '" fill-opacity=".016"/>';
    return s;
  }
};

/* Le cadre commun : fond, décor, halo de frontale, vignette. Le halo est posé
   PAR-DESSUS le décor : c'est ce qui donne l'impression de regarder la scène
   à travers un faisceau, et non de la voir éclairée par le jour. */
function dessiner(nom, cle) {
  const f = DECORS[nom] || DECORS.galerie;
  const r = graine(cle || nom);
  return '<svg viewBox="0 0 400 210" role="img" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<radialGradient id="halo" cx="50%" cy="34%" r="62%">' +
        '<stop offset="0%" stop-color="#c9a227" stop-opacity=".16"/>' +
        '<stop offset="55%" stop-color="#c9a227" stop-opacity=".04"/>' +
        '<stop offset="100%" stop-color="#000000" stop-opacity="0"/>' +
      '</radialGradient>' +
      '<radialGradient id="vign" cx="50%" cy="45%" r="72%">' +
        '<stop offset="55%" stop-color="#000000" stop-opacity="0"/>' +
        '<stop offset="100%" stop-color="#000000" stop-opacity=".82"/>' +
      '</radialGradient>' +
    '</defs>' +
    '<rect width="400" height="210" fill="#08080a"/>' +
    f(r) +
    '<rect width="400" height="210" fill="url(#halo)"/>' +
    '<rect width="400" height="210" fill="url(#vign)"/>' +
    '</svg>';
}


/* ——— L'ambiance sonore ————————————————————————————————————————————————
   Tout est synthétisé : un grondement (bruit brun filtré très bas), des
   gouttes espacées au hasard, un battement de cœur quand la pile devient
   critique. Aucun fichier, donc rien à charger et rien à héberger.
   Le contexte ne peut naître que d'un geste : il est créé au premier clic. */

const Son = (function () {
  let ctx = null, sortie = null, filtre = null;
  let minuterie = null, coeur = null, actif = true, ambianceCourante = "";

  function dispo() {
    return typeof window !== "undefined" && !!(window.AudioContext || window.webkitAudioContext);
  }

  function bruitBrun(duree) {
    const n = Math.floor(ctx.sampleRate * duree);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let dernier = 0;
    for (let i = 0; i < n; i++) {
      const blanc = Math.random() * 2 - 1;
      dernier = (dernier + 0.02 * blanc) / 1.02;
      d[i] = dernier * 3.2;
    }
    return buf;
  }

  function demarrer() {
    if (ctx || !dispo()) { return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      sortie = ctx.createGain();
      sortie.gain.value = actif ? 0.9 : 0;
      sortie.connect(ctx.destination);

      const souffle = ctx.createBufferSource();
      souffle.buffer = bruitBrun(4);
      souffle.loop = true;
      filtre = ctx.createBiquadFilter();
      filtre.type = "lowpass";
      filtre.frequency.value = 260;
      const g = ctx.createGain(); g.gain.value = 0.5;
      souffle.connect(filtre); filtre.connect(g); g.connect(sortie);
      souffle.start();

      const drone = ctx.createOscillator();
      drone.type = "sine"; drone.frequency.value = 44;
      const gd = ctx.createGain(); gd.gain.value = 0.06;
      drone.connect(gd); gd.connect(sortie);
      drone.start();

      programmerGoutte(3000);
    } catch (err) { ctx = null; }
  }

  /* Une goutte : un ping très court, bande étroite, longue queue. Deux gouttes
     ne tombent jamais au même intervalle — c'est ce qui la rend vivante. */
  function goutte() {
    if (!ctx || !actif) { return; }
    try {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain(), b = ctx.createBiquadFilter();
      o.type = "sine";
      o.frequency.setValueAtTime(900 + Math.random() * 900, t);
      o.frequency.exponentialRampToValueAtTime(220 + Math.random() * 160, t + 0.09);
      b.type = "bandpass"; b.frequency.value = 1300; b.Q.value = 2.5;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(b); b.connect(g); g.connect(sortie);
      o.start(t); o.stop(t + 0.45);
    } catch (err) { /* contexte fermé */ }
  }

  function programmerGoutte(base) {
    clearTimeout(minuterie);
    minuterie = setTimeout(function () {
      goutte();
      programmerGoutte(base);
    }, base * (0.4 + Math.random() * 1.3));
  }

  /* Chaque décor a son acoustique : une galerie sèche gronde bas, une galerie
     noyée s'éclaircit et se met à goutter, la surface siffle comme du trafic. */
  const AMBIANCES = {
    eau:      { freq: 520, base: 900 },
    crue:     { freq: 700, base: 500 },
    noir:     { freq: 150, base: 6000 },
    salle:    { freq: 380, base: 4500 },
    fumee:    { freq: 620, base: 7000 },
    jour:     { freq: 1800, base: 20000 },
    rue:      { freq: 1500, base: 20000 },
    chambre:  { freq: 1200, base: 20000 },
    rail:     { freq: 420, base: 9000 },
    puits:    { freq: 300, base: 2600 },
    chatiere: { freq: 200, base: 5200 },
    escalier: { freq: 460, base: 3000 }
  };

  function ambiance(nom) {
    if (!ctx || nom === ambianceCourante) { return; }
    ambianceCourante = nom;
    const a = AMBIANCES[nom] || { freq: 260, base: 3400 };
    try { filtre.frequency.linearRampToValueAtTime(a.freq, ctx.currentTime + 1.4); } catch (err) { /* rien */ }
    programmerGoutte(a.base);
  }

  /* Le cœur ne bat que sous 22 % : c'est le seul signal qui dit « dépêche-toi »
     sans l'écrire. Il s'arrête dès que la pile remonte. */
  function battement(oui) {
    if (!oui) { clearInterval(coeur); coeur = null; return; }
    if (coeur || !ctx) { return; }
    coeur = setInterval(function () {
      if (!actif || !ctx) { return; }
      [0, 0.28].forEach(function (dec, i) {
        try {
          const t = ctx.currentTime + dec;
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(64, t);
          o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(i ? 0.14 : 0.22, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
          o.connect(g); g.connect(sortie);
          o.start(t); o.stop(t + 0.25);
        } catch (err) { /* rien */ }
      });
    }, 1500);
  }

  function clic() {
    if (!ctx || !actif) { return; }
    try {
      const t = ctx.currentTime;
      const s = ctx.createBufferSource(), g = ctx.createGain(), b = ctx.createBiquadFilter();
      s.buffer = bruitBrun(0.1);
      b.type = "highpass"; b.frequency.value = 900;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      s.connect(b); b.connect(g); g.connect(sortie);
      s.start(t); s.stop(t + 0.11);
    } catch (err) { /* rien */ }
  }

  /* La chute : une descente lente vers l'infra-grave, plus longue que tout le
     reste du jeu. C'est le seul moment où le son prend toute la place. */
  function chute(victoire) {
    battement(false);
    if (!ctx || !actif) { return; }
    try {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = victoire ? "triangle" : "sawtooth";
      o.frequency.setValueAtTime(victoire ? 180 : 140, t);
      o.frequency.exponentialRampToValueAtTime(victoire ? 420 : 28, t + (victoire ? 1.6 : 2.6));
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(victoire ? 0.1 : 0.2, t + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (victoire ? 1.8 : 2.9));
      o.connect(g); g.connect(sortie);
      o.start(t); o.stop(t + 3);
    } catch (err) { /* rien */ }
  }

  function basculer(oui) {
    actif = oui;
    if (sortie && ctx) {
      try { sortie.gain.linearRampToValueAtTime(oui ? 0.9 : 0, ctx.currentTime + 0.25); } catch (err) { /* rien */ }
    }
  }

  return { demarrer: demarrer, ambiance: ambiance, battement: battement,
           clic: clic, chute: chute, basculer: basculer, dispo: dispo };
})();

/* Vibration : brève au choix, longue et heurtée à la mort. L'API est absente
   sur iOS et sur ordinateur — on garde tout, on n'échoue jamais bruyamment. */
function vibrer(motif) {
  try { if (navigator && typeof navigator.vibrate === "function") { navigator.vibrate(motif); } }
  catch (err) { /* rien */ }
}


/* ——— Moteur ——————————————————————————————————————————————————————————— */

const CLE_EPITAPHES = "kata.epitaphes";
const CLE_STATS = "kata.stats";
const CLE_PARTIE = "kata.partie";
const CLE_SON = "kata.son";

const ECRANS = ["titre-screen", "jeu-screen", "fin-screen", "epitaphes-screen", "aide-screen"];

let E = null;                        /* état de la descente en cours */
let ecranRetour = "titre-screen";    /* d'où l'on vient, pour les écrans annexes */

function lire(cle, defaut) {
  try { const v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); }
  catch (err) { return defaut; }
}
function ecrire(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (err) { /* navigation privée */ }
}
function effacer(cle) {
  try { localStorage.removeItem(cle); } catch (err) { /* idem */ }
}

/* Même convention que le Quiz : on masque, on affiche, on remonte, et on pose le
   focus sur le premier titre de l'écran affiché. Un écran sans h1-h3 casse le focus. */
function switchScreen(showId) {
  ECRANS.forEach(function (id) {
    document.getElementById(id).classList.toggle("cache", id !== showId);
  });
  window.scrollTo(0, 0);
  const titre = document.getElementById(showId).querySelector("h1, h2, h3");
  if (titre) { titre.setAttribute("tabindex", "-1"); titre.focus(); }
}

function noeudsDeFin() {
  return Object.keys(HISTOIRE).filter(function (id) { return HISTOIRE[id].fin; });
}

function poserParagraphes(zone, paras) {
  zone.textContent = "";
  paras.forEach(function (para) {
    const p = document.createElement("p");
    p.textContent = para;
    zone.appendChild(p);
  });
}

/* ——— Écran-titre —————————————————————————————————————————————————————— */

function afficherTitre() {
  const stats = lire(CLE_STATS, { parties: 0, victoires: 0 });
  const vues = lire(CLE_EPITAPHES, []);

  document.getElementById("titre-scene").innerHTML = dessiner("puits", "titre");
  document.getElementById("titre-accroche").textContent = UI.accroche;
  document.getElementById("titre-stats").textContent = stats.parties
    ? UI.statsFormat.replace("{parties}", stats.parties)
                    .replace("{victoires}", stats.victoires)
                    .replace("{gravees}", vues.length)
                    .replace("{total}", noeudsDeFin().length)
    : UI.statsVierge;

  document.getElementById("btn-reprendre").classList.toggle("cache", !lire(CLE_PARTIE, null));
  Son.battement(false);
  switchScreen("titre-screen");
}

/* ——— Partie ——————————————————————————————————————————————————————————— */

function nouvellePartie() {
  Son.demarrer();
  E = { noeud: "preparation", pile: 100, pas: 0, sac: null, marques: [], journal: [] };
  const stats = lire(CLE_STATS, { parties: 0, victoires: 0 });
  stats.parties += 1;
  ecrire(CLE_STATS, stats);
  afficherNoeud("preparation");
}

function reprendrePartie() {
  Son.demarrer();
  const sauvegarde = lire(CLE_PARTIE, null);
  if (!sauvegarde || !HISTOIRE[sauvegarde.noeud]) { nouvellePartie(); return; }
  E = sauvegarde;
  afficherNoeud(E.noeud);
}

function majJauge() {
  const pct = Math.max(0, Math.min(100, Math.round(E.pile)));
  document.getElementById("jauge-barre").style.width = pct + "%";
  document.getElementById("jauge-valeur").textContent = pct + " %";
  const jauge = document.getElementById("jauge");
  const critique = pct <= 22;
  jauge.classList.toggle("faible", pct <= 50 && !critique);
  jauge.classList.toggle("critique", critique);
  Son.battement(critique);
}

function afficherNoeud(id) {
  const n = HISTOIRE[id];
  if (!n) { afficherTitre(); return; }

  E.noeud = id;
  if (E.journal[E.journal.length - 1] !== (n.lieu || n.titre)) {
    E.journal.push(n.lieu || n.titre);
  }

  if (n.fin) { effacer(CLE_PARTIE); afficherFin(id, n); return; }
  ecrire(CLE_PARTIE, E);

  document.getElementById("noeud-scene").innerHTML = dessiner(n.image, id);
  Son.ambiance(n.image);
  document.getElementById("noeud-lieu").textContent = n.lieu || "";
  document.getElementById("noeud-titre").textContent = n.titre;
  poserParagraphes(document.getElementById("noeud-texte"), n.texte);

  const liste = document.getElementById("choix-liste");
  liste.textContent = "";
  n.choix
    .filter(function (c) { return typeof c.si !== "function" || c.si(E); })
    .forEach(function (c, i) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "choix";
      b.type = "button";
      const num = document.createElement("span");
      num.className = "choix-num";
      num.textContent = (i + 1) + ".";
      b.appendChild(num);
      b.appendChild(document.createTextNode(c.t));
      b.addEventListener("click", function () { jouerChoix(c); });
      li.appendChild(b);
      liste.appendChild(li);
    });

  majJauge();
  switchScreen("jeu-screen");
}

function jouerChoix(c) {
  vibrer(18);
  Son.clic();

  E.pas += 1;
  if (c.sac) { E.sac = c.sac; }
  if (c.pose && E.marques.indexOf(c.pose) === -1) { E.marques.push(c.pose); }

  E.pile -= (typeof c.cout === "number" ? c.cout : 5);

  /* Le rechargement s'applique APRÈS la dépense : changer ses piles coûte encore
     quelques pour cent de l'ancien jeu, et c'est la seule remontée de jauge du jeu. */
  if (typeof c.recharge === "number" && E.pile > 0) { E.pile = c.recharge; }

  /* La pile épuisée l'emporte sur tout le reste : peu importe la destination
     prévue, on ne va nulle part sans lumière. C'est ce qui rend les détours
     coûteux mortels. */
  if (E.pile <= 0) { E.pile = 0; afficherNoeud("mort_obscurite"); return; }

  afficherNoeud((typeof c.vers === "function") ? c.vers(E) : c.vers);
}

/* ——— Dénouement ——————————————————————————————————————————————————————— */

function afficherFin(id, n) {
  const f = n.fin;
  const victoire = f.type === "victoire";

  const vues = lire(CLE_EPITAPHES, []);
  if (vues.indexOf(f.cause) === -1) { vues.push(f.cause); ecrire(CLE_EPITAPHES, vues); }
  if (victoire) {
    const stats = lire(CLE_STATS, { parties: 0, victoires: 0 });
    stats.victoires += 1;
    ecrire(CLE_STATS, stats);
  }

  Son.ambiance(n.image);
  Son.chute(victoire);
  vibrer(victoire ? [30, 60, 30, 60, 260] : [110, 70, 110, 70, 160, 90, 520]);

  document.getElementById("fin-enveloppe").className = "enveloppe fin-" + f.type;
  document.getElementById("fin-scene").innerHTML = dessiner(n.image, id);
  document.getElementById("fin-genre").textContent =
    victoire ? UI.genreVictoire : (f.type === "echec" ? UI.genreEchec : UI.genreMort);
  document.getElementById("fin-titre").textContent = n.titre;
  poserParagraphes(document.getElementById("fin-texte"), n.texte);

  document.getElementById("dalle-mention").textContent =
    victoire ? UI.dalleSortie : (f.type === "echec" ? UI.dalleEchec : UI.dalleGit);
  document.getElementById("dalle-texte").textContent = f.epitaphe;

  const releve = document.getElementById("fin-releve");
  releve.textContent = "";
  [[UI.releveProfondeur, String(E.pas)],
   [UI.releveFrontale, Math.max(0, Math.round(E.pile)) + " %"],
   [UI.releveChemin, E.journal.join(" · "), "chemin"]].forEach(function (paire) {
    const li = document.createElement("li");
    if (paire[2]) { li.className = paire[2]; }
    const g = document.createElement("span"); g.textContent = paire[0];
    const d = document.createElement("b"); d.textContent = paire[1];
    li.appendChild(g); li.appendChild(d);
    releve.appendChild(li);
  });

  switchScreen("fin-screen");
}

/* ——— Épitaphes ———————————————————————————————————————————————————————— */

function afficherEpitaphes(retour) {
  ecranRetour = retour;
  const vues = lire(CLE_EPITAPHES, []);
  document.getElementById("epitaphes-intro").textContent = UI.epitaphesIntro;

  const grille = document.getElementById("epitaphe-grille");
  grille.textContent = "";

  noeudsDeFin().forEach(function (id, i) {
    const f = HISTOIRE[id].fin;
    const connue = vues.indexOf(f.cause) !== -1;
    const li = document.createElement("li");
    li.className = "epitaphe-carte " + (connue ? f.type : "inconnue");

    const cause = document.createElement("p");
    cause.className = "epitaphe-cause";
    cause.textContent = connue ? f.cause : UI.inconnue + " " + (i + 1);

    const mot = document.createElement("p");
    mot.className = "epitaphe-mot";
    mot.textContent = connue ? f.epitaphe : UI.inconnueMots[i % UI.inconnueMots.length];

    li.appendChild(cause); li.appendChild(mot);
    grille.appendChild(li);
  });

  switchScreen("epitaphes-screen");
}

/* ——— Aide ————————————————————————————————————————————————————————————— */

function afficherAide(retour) {
  ecranRetour = retour;
  const zone = document.getElementById("aide-contenu");
  zone.textContent = "";

  UI.aide.forEach(function (bloc) {
    const d = document.createElement("div");
    d.className = "bloc-aide";
    const h = document.createElement("h3"); h.textContent = bloc[0];
    const p = document.createElement("p"); p.textContent = bloc[1];
    d.appendChild(h); d.appendChild(p);
    zone.appendChild(d);
  });

  const av = document.createElement("div");
  av.className = "avertissement";
  const ah = document.createElement("h3"); ah.textContent = UI.avertissementTitre;
  const ap = document.createElement("p"); ap.textContent = UI.avertissementTexte;
  av.appendChild(ah); av.appendChild(ap);
  zone.appendChild(av);

  switchScreen("aide-screen");
}

/* ——— Câblage —————————————————————————————————————————————————————————— */

document.getElementById("btn-descendre").addEventListener("click", nouvellePartie);
document.getElementById("btn-reprendre").addEventListener("click", reprendrePartie);
document.getElementById("btn-redescendre").addEventListener("click", nouvellePartie);
document.getElementById("btn-titre-fin").addEventListener("click", afficherTitre);
document.getElementById("btn-epitaphes-titre").addEventListener("click", function () { afficherEpitaphes("titre-screen"); });
document.getElementById("btn-epitaphes-fin").addEventListener("click", function () { afficherEpitaphes("fin-screen"); });
document.getElementById("btn-aide-titre").addEventListener("click", function () { afficherAide("titre-screen"); });
document.getElementById("btn-retour-epitaphes").addEventListener("click", function () { switchScreen(ecranRetour); });
document.getElementById("btn-retour-aide").addEventListener("click", function () { switchScreen(ecranRetour); });

document.getElementById("btn-abandonner").addEventListener("click", function () {
  if (window.confirm(UI.reprendreConfirme)) { effacer(CLE_PARTIE); afficherTitre(); }
});

const btnSon = document.getElementById("btn-son");
function majBoutonSon(actif) {
  btnSon.setAttribute("aria-pressed", actif ? "true" : "false");
  btnSon.textContent = actif ? UI.sonActif : UI.sonCoupe;
}
btnSon.addEventListener("click", function () {
  const actif = btnSon.getAttribute("aria-pressed") !== "true";
  ecrire(CLE_SON, actif);
  majBoutonSon(actif);
  Son.basculer(actif);
});
majBoutonSon(lire(CLE_SON, true));
Son.basculer(lire(CLE_SON, true));
if (!Son.dispo()) { btnSon.classList.add("cache"); }

/* Les chiffres 1 à 4 choisissent. On ne les capte que sur l'écran de jeu, et
   jamais avec un modificateur — sinon on vole Ctrl+1 au navigateur. */
document.addEventListener("keydown", function (ev) {
  if (document.getElementById("jeu-screen").classList.contains("cache")) { return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) { return; }
  const n = parseInt(ev.key, 10);
  if (!n || n < 1 || n > 9) { return; }
  const boutons = document.querySelectorAll("#choix-liste .choix");
  if (boutons[n - 1]) { ev.preventDefault(); boutons[n - 1].click(); }
});

afficherTitre();
</script>
</body>
